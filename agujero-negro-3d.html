<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador 3D: Agujero Negro | Blog Leonardo N. Hernandez</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="agujero-negro-3d.css">

    <!-- Material Web Components -->
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/",
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import '@material/web/all.js';
    </script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background-color: #000;">

    <!-- Visor de errores -->
    <div id="error-overlay" style="display:none; position:absolute; z-index:99999; background:#900; color:#fff; padding:2rem; top:0; left:0; width:100%; height:100%; overflow:auto; font-family:monospace;">
        <h2>Error Crítico</h2>
        <div id="error-log"></div>
    </div>

    <!-- Contenedor a pantalla completa -->
    <div id="canvas-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden;">
        
        <!-- Interfaz superpuesta limpia (Izquierda) -->
        <div style="position: absolute; top: max(2rem, env(safe-area-inset-top, 2rem)); left: max(2rem, env(safe-area-inset-left, 2rem)); z-index: 100; pointer-events: none;">
            <a href="museo.html" style="pointer-events: auto; color: #00e5ff; text-decoration: none; font-family: var(--font-mono, 'Space Mono', monospace); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 0.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); transition: opacity 0.2s;">&larr; Regresar al Museo</a>
            <h1 style="margin: 0; color: #f4f4f4; font-family: var(--font-sans, 'Inter', sans-serif); font-size: 2rem; font-weight: 600; letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,1.0);">Simulación de Agujero Negro</h1>
        </div>

        <!-- Interfaz superpuesta (Derecha/Abajo) -->
        <div style="position: absolute; bottom: max(2rem, env(safe-area-inset-bottom, 2rem)); right: max(2rem, env(safe-area-inset-right, 2rem)); z-index: 100; pointer-events: none;">
            <a href="#" id="btn-fullscreen" style="pointer-events: auto; color: #00e5ff; text-decoration: none; font-family: var(--font-mono, 'Space Mono', monospace); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; display: inline-block; padding: 0.5rem 1rem; border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 4px; background: rgba(0,0,0,0.4); text-shadow: 0 2px 4px rgba(0,0,0,0.8); transition: all 0.2s;">
                [ ] Pantalla Completa
            </a>
        </div>

        <canvas id="glcanvas"></canvas>
        
        <div class="bh3d-overlay-hint" id="hint-drag">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="7.5 4.21 12 6.81 16.5 4.21"></polyline>
                <polyline points="7.5 19.79 7.5 14.6 3 12"></polyline>
                <polyline points="21 12 16.5 14.6 16.5 19.79"></polyline>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            Arrastra para rotar
        </div>
    </div>

    <script type="module">
        window.onerror = function(msg, url, line) {
            const errDiv = document.getElementById('error-overlay');
            errDiv.style.display = 'block';
            document.getElementById('error-log').innerHTML += "<p>" + msg + " (Línea: " + line + ")</p>";
        };

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec2 u_resolution;
            uniform float u_time;
            uniform vec3 u_cameraPos;
            uniform vec3 u_cameraDir;
            uniform vec3 u_cameraUp;
            uniform vec3 u_cameraRight;
            uniform float u_fov;

            varying vec2 vUv;

            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            float hash(float n) { return fract(sin(n) * 43758.5453123); }
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                float n = p.x + p.y * 57.0 + 113.0 * p.z;
                return mix(mix(mix(hash(n + 0.0), hash(n + 1.0), f.x),
                               mix(hash(n + 57.0), hash(n + 58.0), f.x), f.y),
                           mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                               mix(hash(n + 170.0), hash(n + 171.0), f.x), f.y), f.z);
            }

            float fbm(vec3 p) {
                float f = 0.0;
                float w = 0.5;
                for (int i = 0; i < 4; i++) {
                    f += w * noise(p);
                    p *= 2.0;
                    w *= 0.4;
                }
                return f;
            }

            float getDiskDensity(vec3 p) {
                float r = length(p.xz);
                
                if(r < 2.6 || r > 12.0) return 0.0;
                
                float h = abs(p.y);
                float scaleH = exp(-h * 5.0);
                if(scaleH < 0.01) return 0.0;
                
                // Velocidad diferencial baja (Agujero Supermasivo)
                float angularSpeed = 0.08 * 6.0 / pow(max(r, 0.1), 1.5);
                vec3 pRot = p;
                pRot.xz *= rot(-u_time * angularSpeed);
                
                float rings = sin(r * 15.0 + fbm(pRot * 2.0) * 5.0);
                rings = smoothstep(-0.2, 1.0, rings);
                
                float clouds = fbm(pRot * 3.0);
                float density = rings * clouds * scaleH;
                float fadeR = smoothstep(2.6, 3.2, r) * smoothstep(12.0, 8.0, r);
                
                return density * fadeR * 4.0;
            }

            void main() {
                vec2 uv = (vUv - 0.5) * 2.0;
                float aspect = u_resolution.y > 0.0 ? u_resolution.x / u_resolution.y : 1.0;
                uv.x *= aspect;
                
                float fovScale = tan(u_fov * 0.5 * 3.14159 / 180.0);
                vec3 rayDir = normalize(uv.x * u_cameraRight * fovScale + uv.y * u_cameraUp * fovScale + u_cameraDir);
                vec3 rayPos = u_cameraPos;

                vec3 col = vec3(0.0);
                float transmittance = 1.0;
                
                // Paleta de colores cálidos y fijos
                vec3 hot = vec3(1.0, 0.5, 0.1); // Naranja brillante
                vec3 cold = vec3(0.4, 0.05, 0.0); // Rojo oscuro
                
                float dt = 0.06;
                const int MAX_STEPS = 250;
                
                for(int i = 0; i < MAX_STEPS; i++) {
                    float r2 = dot(rayPos, rayPos);
                    float r = sqrt(r2);
                    
                    if(r < 2.2) {
                        transmittance = 0.0;
                        break;
                    }
                    
                    // Lente Gravitacional
                    vec3 force = -rayPos / (r2 * r);
                    rayDir = normalize(rayDir + force * 2.5 * dt);
                    
                    if(abs(rayPos.y) < 2.0 && r < 14.0) {
                        float d = getDiskDensity(rayPos);
                        if(d > 0.0) {
                            float temp = smoothstep(12.0, 2.6, r);
                            vec3 localColor = mix(cold, hot, temp);
                            
                            // Efecto Doppler (Intensidad disminuida)
                            vec3 velDir = normalize(vec3(-rayPos.z, 0.0, rayPos.x));
                            float doppler = dot(rayDir, velDir); 
                            float boost = max(0.0, 1.0 + doppler * 0.45); 
                            localColor *= pow(boost, 2.0); 

                            float emission = d * 1.8;
                            col += localColor * emission * transmittance * dt;
                            transmittance *= exp(-d * dt * 0.4);
                        }
                    }
                    
                    // SOLUCIÓN AL BUG DEL ZOOM
                    float stepSize;
                    if (r > 15.0) {
                        stepSize = r - 14.5; 
                    } else {
                        stepSize = dt * min(1.5, max(0.5, r * 0.3));
                    }
                    
                    rayPos += rayDir * stepSize;
                    
                    if(r > 70.0 || transmittance < 0.01) break;
                }
                
                if(transmittance > 0.01) {
                    float starNoise = noise(rayDir * 200.0);
                    float stars = pow(max(0.0, starNoise - 0.75) * 4.0, 5.0);
                    col += vec3(stars) * transmittance;
                }

                col = col * 1.5; 
                col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        let scene, camera, orthoCamera, renderer, material, controls;
        const DOM = {
            container: document.getElementById('canvas-container'),
            canvas: document.getElementById('glcanvas')
        };

        function init() {
            try {
                let width = DOM.container.clientWidth || window.innerWidth;
                let height = DOM.container.clientHeight || window.innerHeight;

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
                // Inicio en el zoom más lejano (r = ~49)
                camera.position.set(0, 10, 48); 

                orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);

                renderer = new THREE.WebGLRenderer({ canvas: DOM.canvas, antialias: false });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(width, height);

                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.enablePan = false;
                controls.minDistance = 6;
                controls.maxDistance = 50; 

                const geometry = new THREE.PlaneGeometry(2, 2);
                material = new THREE.ShaderMaterial({
                    vertexShader,
                    fragmentShader,
                    uniforms: {
                        u_resolution: { value: new THREE.Vector2(width, height) },
                        u_time: { value: 0 },
                        u_cameraPos: { value: camera.position },
                        u_cameraDir: { value: new THREE.Vector3() },
                        u_cameraUp: { value: new THREE.Vector3() },
                        u_cameraRight: { value: new THREE.Vector3() },
                        u_fov: { value: camera.fov }
                    },
                    depthWrite: false,
                    depthTest: false
                });
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                window.addEventListener('resize', onWindowResize);

                animate(0);
                
                setTimeout(() => {
                    const h = document.getElementById('hint-drag');
                    if(h) h.style.display = 'none';
                }, 5000);

                // Fullscreen logic
                const btnFs = document.getElementById('btn-fullscreen');
                if (btnFs) {
                    btnFs.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                            const docEl = document.documentElement;
                            const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
                            if (requestFS) {
                                requestFS.call(docEl).catch(err => console.log(err.message));
                            } else {
                                alert("Tu navegador no soporta pantalla completa automática.");
                            }
                        } else {
                            const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
                            if (exitFS) exitFS.call(document);
                        }
                    });
                }
                
                const onFSChange = () => {
                    if (btnFs) {
                        const isFS = document.fullscreenElement || document.webkitFullscreenElement;
                        btnFs.innerHTML = isFS ? "[x] Salir de Pantalla" : "[ ] Pantalla Completa";
                    }
                };
                document.addEventListener('fullscreenchange', onFSChange);
                document.addEventListener('webkitfullscreenchange', onFSChange);

            } catch(e) {
                window.onerror(e.message, 'internal', 0);
            }
        }

        function onWindowResize() {
            const width = DOM.container.clientWidth || window.innerWidth;
            const height = DOM.container.clientHeight || window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            material.uniforms.u_resolution.value.set(width, height);
        }

        const camDir = new THREE.Vector3();
        const camUp = new THREE.Vector3();
        const camRight = new THREE.Vector3();

        function animate(time) {
            requestAnimationFrame(animate);
            controls.update();

            camera.getWorldDirection(camDir);
            camUp.copy(camera.up).applyQuaternion(camera.quaternion);
            camRight.crossVectors(camDir, camUp).normalize();

            material.uniforms.u_time.value = time * 0.001;
            material.uniforms.u_cameraPos.value.copy(camera.position);
            material.uniforms.u_cameraDir.value.copy(camDir);
            material.uniforms.u_cameraUp.value.copy(camUp);
            material.uniforms.u_cameraRight.value.copy(camRight);

            renderer.render(scene, orthoCamera);
        }

        if(document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
